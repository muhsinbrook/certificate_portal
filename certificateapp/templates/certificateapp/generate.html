{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Certificate</title>
    <link rel="stylesheet" href="{% static 'certificateapp/css/style.css' %}">
</head>
<body>
    <div class="form-wrapper">
        <h1>Certificate Generator</h1>
        <p class="subtitle">Fill in the details below</p>

        <form method="post" action="{% url 'certificateapp:generate_certificate' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-generate">Generate Certificate</button>
        </form>
    </div>
</body>
</html>
